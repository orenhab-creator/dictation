<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>המתרגל שלי PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --error: #ef4444; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; touch-action: manipulation; }
        .btn-grad { background: linear-gradient(to right, #4f46e5, #6366f1); transition: 0.3s; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .progress-fill { height: 100%; background: var(--secondary); transition: width 0.4s ease; }
        .error-card { border-right: 4px solid var(--error); background: #fef2f2; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen">

    <header class="text-center py-4">
        <h1 class="text-3xl font-black text-indigo-600 italic">המתרגל שלי <span class="text-emerald-500">PRO</span></h1>
    </header>

    <!-- מסך הזנה -->
    <div id="setup-section" class="card p-6 shadow-xl border-t-8 border-indigo-600">
        <h2 class="text-xl font-bold mb-4 text-gray-800 text-center text-sm">הכנת רשימת מילים</h2>
        <input type="file" id="image-input" accept="image/*" multiple class="hidden">
        <button onclick="document.getElementById('image-input').click()" class="w-full btn-grad text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 mb-2">
            📸 סריקת דפים מהגלריה
        </button>
        <div id="scan-status" class="hidden mb-4 p-3 bg-indigo-50 rounded-xl">
            <div class="text-xs text-indigo-600 font-bold mb-1" id="scan-text">מעבד...</div>
            <div class="w-full bg-indigo-200 h-1.5 rounded-full overflow-hidden"><div id="scan-progress" class="bg-indigo-600 h-full transition-all" style="width: 0%"></div></div>
        </div>
        <textarea id="word-input" class="w-full p-4 border rounded-2xl h-40 text-sm focus:border-indigo-300 outline-none" dir="ltr" placeholder="מילה, פירוש"></textarea>
        <button onclick="saveWords()" class="w-full mt-4 bg-emerald-500 text-white py-4 rounded-2xl font-black text-lg">שמור והתחל! 🚀</button>
    </div>

    <!-- תפריט משחקים -->
    <div id="game-menu" class="hidden space-y-4 animate__animated animate__fadeIn">
        <div class="grid grid-cols-2 gap-3">
            <button onclick="startStudy()" class="card p-4 text-center border-b-4 border-blue-400">📖<br><b>לימוד</b></button>
            <button onclick="startQuiz()" class="card p-4 text-center border-b-4 border-amber-400">🎯<br><b>אמריקאי</b></button>
            <button onclick="startSpelling()" class="card p-4 text-center border-b-4 border-purple-400">✍️<br><b>הכתבה</b></button>
            <button onclick="startTranslation()" class="card p-4 text-center border-b-4 border-emerald-400">🇮🇱<br><b>תרגום</b></button>
        </div>

        <button onclick="giveMotivation()" class="w-full p-6 bg-gradient-to-r from-pink-500 to-orange-400 text-white rounded-2xl font-black text-xl shadow-lg transform active:scale-95 transition-all">
            ✨ לחץ כאן לחיזוק יומי! ✨
        </button>

        <button onclick="clearAll()" class="w-full mt-2 text-red-400 text-sm italic">מחיקת הכל והתחלה מחדש</button>
    </div>

    <!-- אזור המשחק -->
    <div id="game-area" class="hidden">
        <div class="flex justify-between items-center mb-4 gap-4">
            <div class="flex-grow h-2 bg-gray-200 rounded-full overflow-hidden"><div id="progress" class="progress-fill" style="width: 0%"></div></div>
            <button onclick="backToMenu()" class="text-xs bg-gray-200 px-3 py-1 rounded-full font-bold text-gray-500">יציאה ✖</button>
        </div>
        <div id="game-content"></div>
    </div>

    <!-- מסך סיכום -->
    <div id="finish-screen" class="hidden animate__animated animate__fadeIn">
        <div class="card p-6 text-center mb-6">
            <div id="medal-icon" class="text-6xl mb-2">🏆</div>
            <h2 id="finish-title" class="text-2xl font-black text-indigo-700">סיכום שלב</h2>
            <div class="text-6xl font-black text-emerald-500 my-4" id="final-score">100</div>
            <p id="score-details" class="text-sm text-gray-500 mb-4"></p>
            <button id="review-errors-btn" class="hidden w-full bg-amber-500 text-white py-4 rounded-2xl font-black shadow-lg mb-2 italic">🎯 תרגל רק את הטעויות</button>
            <button onclick="backToMenu()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold">חזרה לתפריט</button>
        </div>
        <div id="errors-container" class="hidden text-right">
            <h3 class="font-bold text-red-500 mb-3 px-2">דגשים לשיפור:</h3>
            <div id="errors-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let allWords = []; let activeWords = []; let currentIndex = 0; let sessionErrors = []; let currentGameMode = '';
        const motivations = ["אתה אלוף!", "איזה ריכוז!", "אני גאה בך!", "יש לך זיכרון מעולה!", "כל טעות היא למידה!", "אתה פשוט מוכשר!"];

        window.onload = () => {
            const saved = localStorage.getItem('myWords');
            if (saved) document.getElementById('word-input').value = saved;
        };

        // מקש Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const btn = document.querySelector('#game-content button.bg-emerald-500, #game-content button.btn-grad');
                if (btn) btn.click();
            }
        });

        function giveMotivation() { alert(motivations[Math.floor(Math.random() * motivations.length)]); }

        function speak(t) {
            const m = new SpeechSynthesisUtterance(t);
            m.lang = 'en-US';
            window.speechSynthesis.speak(m);
        }

        document.getElementById('image-input').addEventListener('change', async (e) => {
            const files = e.target.files; if (!files.length) return;
            const status = document.getElementById('scan-status');
            const textArea = document.getElementById('word-input');
            status.classList.remove('hidden');
            let text = textArea.value;
            for (let i = 0; i < files.length; i++) {
                document.getElementById('scan-text').innerText = `סורק ${i+1}/${files.length}`;
                document.getElementById('scan-progress').style.width = ((i+1)/files.length)*100 + '%';
                const res = await Tesseract.recognize(files[i], 'eng+heb');
                res.data.text.split('\n').forEach(l => {
                    const eng = (l.match(/[a-zA-Z]+/g) || [])[0];
                    const heb = (l.match(/[\u0590-\u05FF]+/g) || [])[0];
                    if (eng && heb) text += `${eng}, ${heb}\n`;
                });
                textArea.value = text;
            }
            status.classList.add('hidden');
        });

        function saveWords() {
            const input = document.getElementById('word-input').value;
            localStorage.setItem('myWords', input);
            allWords = input.split('\n').map(l => {
                const p = l.split(',');
                if (p.length >= 2) return { en: p[0].trim(), he: p[1].trim() };
                const eng = (l.match(/[a-zA-Z]+/g) || [])[0];
                const heb = (l.match(/[\u0590-\u05FF]+/g) || [])[0];
                return (eng && heb) ? { en: eng, he: heb } : null;
            }).filter(i => i);
            if (allWords.length > 0) {
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('game-menu').classList.remove('hidden');
            }
        }

        function setupGame(mode, list = allWords) {
            currentGameMode = mode; activeWords = [...list]; currentIndex = 0; sessionErrors = [];
            document.getElementById('game-menu').classList.add('hidden');
            document.getElementById('finish-screen').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            runMode();
        }

        function runMode() {
            document.getElementById('progress').style.width = (currentIndex / activeWords.length) * 100 + '%';
            if (currentIndex >= activeWords.length) { showFinish(); return; }
            const w = activeWords[currentIndex];
            const content = document.getElementById('game-content');

            if (currentGameMode === 'quiz') {
                let opts = [w.he];
                while(opts.length < 3 && allWords.length > 2) {
                    let r = allWords[Math.floor(Math.random()*allWords.length)].he;
                    if(!opts.includes(r)) opts.push(r);
                }
                opts.sort(()=>Math.random()-0.5);
                content.innerHTML = `<div class="card p-6 text-center animate__animated animate__fadeIn"><h2 class="text-4xl font-black text-indigo-600 mb-8">${w.en}</h2>${opts.map(o => `<button onclick="checkStep('${o}','${w.he}')" class="w-full p-4 mb-3 border-2 rounded-2xl font-bold text-lg">${o}</button>`).join('')}</div>`;
            } 
            else if (currentGameMode === 'spelling') {
                content.innerHTML = `<div class="card p-8 text-center animate__animated animate__fadeInRight"><h3 class="text-4xl font-black mb-8 text-gray-800">${w.he}</h3><input type="text" id="game-input" class="w-full p-4 border-b-4 border-indigo-200 text-3xl font-bold text-center outline-none" autocomplete="off" autofocus><button onclick="checkStep(document.getElementById('game-input').value,'${w.en}')" class="w-full mt-8 btn-grad text-white py-4 rounded-2xl font-black">בדוק (Enter)</button></div>`;
                document.getElementById('game-input').focus();
            }
            else if (currentGameMode === 'translation') {
                content.innerHTML = `<div class="card p-8 text-center animate__animated animate__fadeInLeft"><h3 class="text-4xl font-black mb-8 text-indigo-600">${w.en}</h3><input type="text" id="game-input" class="w-full p-4 border-b-4 border-emerald-200 text-3xl font-bold text-center outline-none" autocomplete="off" autofocus><button onclick="checkStep(document.getElementById('game-input').value,'${w.he}')" class="w-full mt-8 bg-emerald-500 text-white py-4 rounded-2xl font-black">בדוק (Enter)</button></div>`;
                document.getElementById('game-input').focus();
            }
        }

        function checkStep(input, correct) {
            const currentObj = activeWords[currentIndex];
            if (input.trim().toLowerCase() !== correct.toLowerCase()) {
                sessionErrors.push({ word: currentGameMode === 'spelling' ? currentObj.he : currentObj.en, user: input || "ריק", correct: correct, original: currentObj });
            }
            currentIndex++; runMode();
        }

        function showFinish() {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('finish-screen').classList.remove('hidden');
            const score = Math.max(0, 100 - Math.round((sessionErrors.length / activeWords.length) * 100));
            document.getElementById('final-score').innerText = score;
            const reviewBtn = document.getElementById('review-errors-btn');
            if (sessionErrors.length > 0) {
                reviewBtn.classList.remove('hidden');
                reviewBtn.onclick = () => setupGame(currentGameMode, sessionErrors.map(e => e.original));
                document.getElementById('errors-container').classList.remove('hidden');
                document.getElementById('errors-list').innerHTML = sessionErrors.map(e => `<div class="error-card p-3 rounded-xl mb-2 text-sm font-bold flex justify-between"><span>${e.word}</span><span class="text-emerald-600">${e.correct}</span></div>`).join('');
            } else { reviewBtn.classList.add('hidden'); document.getElementById('errors-container').classList.add('hidden'); }
        }

        function startStudy() {
            document.getElementById('game-menu').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            let html = '<div class="space-y-3">';
            allWords.forEach(w => {
                html += `
                    <div class="card p-4 flex justify-between items-center shadow-sm">
                        <button onclick="speak('${w.en}')" class="w-12 h-12 bg-blue-500 text-white rounded-full shadow-md flex items-center justify-center text-xl active:scale-90 transition-transform">🔊</button>
                        <div class="text-right flex flex-col">
                            <span class="font-black text-xl text-indigo-600">${w.en}</span>
                            <span class="text-gray-500 font-medium">${w.he}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('game-content').innerHTML = html + `</div><button onclick="backToMenu()" class="w-full mt-6 py-3 bg-gray-100 rounded-xl text-gray-500 font-bold">סגור וחזור לתפריט</button>`;
        }

        function startQuiz() { setupGame('quiz'); }
        function startSpelling() { setupGame('spelling'); }
        function startTranslation() { setupGame('translation'); }
        function backToMenu() { document.getElementById('game-area').classList.add('hidden'); document.getElementById('finish-screen').classList.add('hidden'); document.getElementById('game-menu').classList.remove('hidden'); }
        function clearAll() { if(confirm("למחוק הכל?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
