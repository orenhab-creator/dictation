<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>המתרגל שלי PRO - סריקה חכמה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn-grad { background: linear-gradient(to right, #4f46e5, #6366f1); }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .progress-fill { height: 100%; background: var(--secondary); transition: width 0.4s ease; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen">

    <header class="text-center py-4">
        <h1 class="text-3xl font-black text-indigo-600 italic">המתרגל שלי <span class="text-emerald-500">PRO</span></h1>
    </header>

    <div id="setup-section" class="card p-6 border-t-8 border-indigo-600 animate__animated animate__fadeIn">
        <h2 class="text-lg font-bold mb-4 text-center">סריקת מילים חכמה</h2>
        
        <input type="file" id="image-input" accept="image/*" multiple class="hidden">
        <button onclick="document.getElementById('image-input').click()" class="w-full btn-grad text-white py-5 rounded-2xl font-bold shadow-lg mb-4 flex items-center justify-center gap-2">
            📸 בחר תמונות ברורות
        </button>

        <div id="scan-status" class="hidden mb-4 p-4 bg-indigo-50 rounded-2xl border border-indigo-100 text-center">
            <div id="scan-text" class="text-indigo-700 font-bold text-sm mb-2 italic">מנתח את הדף...</div>
            <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden"><div id="scan-progress" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div></div>
        </div>

        <textarea id="word-input" class="w-full p-4 border rounded-2xl h-40 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium" dir="ltr" placeholder="המילים יופיעו כאן..."></textarea>
        <button onclick="clearInput()" class="w-full mt-2 py-2 text-red-500 text-sm font-bold border-2 border-red-50 rounded-xl">🗑️ נקה רשימה</button>
        <button onclick="saveWords()" class="w-full mt-6 bg-emerald-500 text-white py-4 rounded-2xl font-black text-lg shadow-md transition-transform active:scale-95">שמור והמשך 🚀</button>
    </div>

    <!-- שאר המסכים נשארים זהים, נתמקד בשיפור הסריקה ב-Script -->
    <div id="game-menu" class="hidden space-y-4 animate__animated animate__fadeIn">
        <div class="grid grid-cols-2 gap-3">
            <button onclick="startStudy()" class="card p-5 text-center border-b-4 border-blue-400">📖<br><b>לימוד</b></button>
            <button onclick="startQuiz()" class="card p-5 text-center border-b-4 border-amber-400">🎯<br><b>אמריקאי</b></button>
            <button onclick="startSpelling()" class="card p-5 text-center border-b-4 border-purple-400">✍️<br><b>הכתבה</b></button>
            <button onclick="startTranslation()" class="card p-5 text-center border-b-4 border-emerald-400">🇮🇱<br><b>תרגום</b></button>
        </div>
        <button onclick="giveMotivation()" class="w-full p-5 bg-gradient-to-r from-pink-500 to-orange-400 text-white rounded-2xl font-black text-lg shadow-lg">✨ חיזוק יומי ✨</button>
        <button onclick="location.reload()" class="w-full text-gray-400 text-xs italic">חזרה למסך הוספת מילים</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="flex justify-between items-center mb-4"><div class="flex-grow h-2 bg-gray-200 rounded-full overflow-hidden"><div id="progress" class="progress-fill" style="width: 0%"></div></div><button id="exit-btn" onclick="handleExit()" class="mr-4 text-xs font-bold text-red-400 bg-red-50 px-3 py-1 rounded-full">✖ יציאה</button></div>
        <div id="game-content" class="animate__animated animate__fadeIn"></div>
    </div>

    <div id="finish-screen" class="hidden card p-6 text-center animate__animated animate__fadeIn">
        <div class="text-6xl mb-2">📊</div>
        <h2 id="finish-title" class="text-2xl font-black text-indigo-700">סיכום</h2>
        <div class="text-6xl font-black text-emerald-500 my-4" id="final-score">0</div>
        <div class="grid grid-cols-3 gap-2 mb-6 text-xs font-bold">
            <div class="p-2 bg-green-50 text-green-600 rounded-xl">נכון: <span id="count-correct">0</span></div>
            <div class="p-2 bg-red-50 text-red-600 rounded-xl">שגוי: <span id="count-wrong">0</span></div>
            <div class="p-2 bg-gray-50 text-gray-400 rounded-xl">לא בוצע: <span id="count-unperformed">0</span></div>
        </div>
        <div id="errors-container" class="hidden text-right mt-4"><h3 class="font-bold text-red-500 mb-2 px-2">מילים לשיפור:</h3><div id="errors-list" class="space-y-2 text-sm"></div></div>
        <button id="review-errors-btn" class="hidden w-full bg-amber-500 text-white py-4 rounded-2xl font-black mt-4">🎯 תרגול טעויות</button>
        <button onclick="backToMenu()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-2">חזרה</button>
    </div>

    <script>
        let allWords = [], activeWords = [], currentIndex = 0, sessionErrors = [], currentGameMode = '';
        const motivations = ["אתה אלוף!", "איזה ריכוז!", "גאה בך!", "זיכרון מעולה!", "אתה מוכשר!"];

        window.onload = () => {
            const saved = localStorage.getItem('myWords');
            if (saved) document.getElementById('word-input').value = saved;
        };

        function clearInput() {
            if(confirm("למחוק הכל?")) { document.getElementById('word-input').value = ""; localStorage.removeItem('myWords'); }
        }

        // --- שיפור סריקה (הוספת Grayscale ושיפור ניגודיות) ---
        async function preprocessImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 1500; // מעט יותר גדול לדיוק
                        let width = img.width, height = img.height;
                        
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        
                        // ציור התמונה
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // עיבוד תמונה בסיסי: הפיכה לשחור-לבן וחיזוק ניגודיות
                        const imageData = ctx.getImageData(0, 0, width, height);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                            // אם הפיקסל בהיר - הפוך ללבן. אם כהה - הפוך לשחור (Thresholding)
                            const val = avg > 128 ? 255 : 0; 
                            data[i] = data[i+1] = data[i+2] = val;
                        }
                        ctx.putImageData(imageData, 0, 0);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('image-input').addEventListener('change', async (e) => {
            const files = e.target.files; if (!files.length) return;
            const status = document.getElementById('scan-status');
            const textArea = document.getElementById('word-input');
            status.classList.remove('hidden');
            
            const worker = await Tesseract.createWorker('eng+heb');
            let accumulatedText = textArea.value;

            for (let i = 0; i < files.length; i++) {
                document.getElementById('scan-text').innerText = `מנתח דף ${i+1}/${files.length}...`;
                document.getElementById('scan-progress').style.width = ((i+1)/files.length)*100 + '%';
                
                try {
                    const processedData = await preprocessImage(files[i]);
                    const { data: { text } } = await worker.recognize(processedData);
                    
                    // ניקוי טקסט חכם
                    text.split('\n').forEach(l => {
                        // ניקוי תווים מיותרים
                        const line = l.replace(/[|\\/_~ מצב]/g, '').trim();
                        const eng = (line.match(/[a-zA-Z]{2,}/g) || [])[0];
                        const heb = (line.match(/[\u0590-\u05FF]{2,}/g) || [])[0];
                        
                        if (eng && heb) {
                            accumulatedText += `${eng}, ${heb}\n`;
                        }
                    });
                    textArea.value = accumulatedText;
                } catch (err) { console.error("סריקה נכשלה", err); }
            }
            await worker.terminate();
            status.classList.add('hidden');
            localStorage.setItem('myWords', textArea.value);
        });

        // --- שאר הפונקציות (נשארות זהות לגרסה הקודמת) ---
        function saveWords() {
            const input = document.getElementById('word-input').value;
            localStorage.setItem('myWords', input);
            allWords = input.split('\n').map(l => {
                const p = l.split(',');
                if (p.length >= 2) return { en: p[0].trim(), he: p[1].trim() };
                const eng = (l.match(/[a-zA-Z]+/g) || [])[0];
                const heb = (l.match(/[\u0590-\u05FF]+/g) || [])[0];
                return (eng && heb) ? { en: eng, he: heb } : null;
            }).filter(i => i);
            if (allWords.length > 0) { document.getElementById('setup-section').classList.add('hidden'); document.getElementById('game-menu').classList.remove('hidden'); }
        }

        function handleExit() { currentGameMode === 'study' ? backToMenu() : showFinish(true); }

        function setupGame(mode, list = allWords) {
            currentGameMode = mode; activeWords = [...list]; currentIndex = 0; sessionErrors = [];
            document.getElementById('game-menu').classList.add('hidden');
            document.getElementById('finish-screen').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            const exitBtn = document.getElementById('exit-btn');
            if (mode === 'study') { exitBtn.innerText = "✖ סגור"; exitBtn.className = "mr-4 text-xs font-bold text-gray-400 bg-gray-50 px-3 py-1 rounded-full"; }
            else { exitBtn.innerText = "✖ יציאה וסיכום"; exitBtn.className = "mr-4 text-xs font-bold text-red-400 bg-red-50 px-3 py-1 rounded-full"; }
            runMode();
        }

        function runMode() {
            document.getElementById('progress').style.width = (currentIndex / activeWords.length) * 100 + '%';
            if (currentIndex >= activeWords.length) { showFinish(); return; }
            const w = activeWords[currentIndex];
            const content = document.getElementById('game-content');
            if (currentGameMode === 'quiz') {
                let opts = [w.he]; while(opts.length < 3 && allWords.length > 2) {
                    let r = allWords[Math.floor(Math.random()*allWords.length)].he;
                    if(!opts.includes(r)) opts.push(r);
                }
                opts.sort(()=>Math.random()-0.5);
                content.innerHTML = `<div class="card p-6 text-center animate__animated animate__fadeIn"><h2 class="text-4xl font-black text-indigo-600 mb-8">${w.en}</h2>${opts.map(o => `<button onclick="checkStep('${o}','${w.he}')" class="w-full p-4 mb-3 border-2 rounded-2xl font-bold text-lg active:bg-gray-50">${o}</button>`).join('')}</div>`;
            } else {
                const isS = currentGameMode === 'spelling';
                content.innerHTML = `<div class="card p-8 text-center animate__animated animate__fadeIn"><h3 class="text-4xl font-black mb-8 text-gray-800">${isS ? w.he : w.en}</h3><input type="text" id="game-input" class="w-full p-4 border-b-4 border-indigo-200 text-3xl font-bold text-center outline-none" autocomplete="off" autofocus><button onclick="checkStep(document.getElementById('game-input').value,'${isS ? w.en : w.he}')" class="w-full mt-8 btn-grad text-white py-4 rounded-2xl font-black shadow-lg">בדוק</button></div>`;
                document.getElementById('game-input').focus();
            }
        }

        function checkStep(input, correct) {
            const currentObj = activeWords[currentIndex];
            if (input.trim().toLowerCase() !== correct.toLowerCase()) {
                sessionErrors.push({ word: currentGameMode === 'spelling' ? currentObj.he : currentObj.en, user: input || "ריק", correct: correct, original: currentObj });
            }
            currentIndex++; runMode();
        }

        function showFinish() {
            if (currentGameMode === 'study') { backToMenu(); return; }
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('finish-screen').classList.remove('hidden');
            const perf = currentIndex, corr = perf - sessionErrors.length, unperf = activeWords.length - perf;
            const score = perf > 0 ? Math.round((corr / perf) * 100) : 0;
            document.getElementById('final-score').innerText = score;
            document.getElementById('count-correct').innerText = corr;
            document.getElementById('count-wrong').innerText = sessionErrors.length;
            document.getElementById('count-unperformed').innerText = unperf;
            const reviewBtn = document.getElementById('review-errors-btn');
            if (sessionErrors.length > 0) {
                reviewBtn.classList.remove('hidden');
                reviewBtn.onclick = () => setupGame(currentGameMode, sessionErrors.map(e => e.original));
                document.getElementById('errors-container').classList.remove('hidden');
                document.getElementById('errors-list').innerHTML = sessionErrors.map(e => `<div class="p-3 bg-red-50 rounded-xl mb-2 flex justify-between font-bold"><span>${e.word}</span><span class="text-emerald-600">${e.correct}</span></div>`).join('');
            } else { reviewBtn.classList.add('hidden'); document.getElementById('errors-container').classList.add('hidden'); }
        }

        function startStudy() {
            setupGame('study');
            document.getElementById('game-content').innerHTML = `<div class="space-y-3 animate__animated animate__fadeInUp">${allWords.map(w => `<div class="card p-4 flex justify-between items-center shadow-sm"><span>${w.en} - ${w.he}</span><button onclick="speak('${w.en}')" class="w-10 h-10 bg-indigo-500 text-white rounded-full flex items-center justify-center text-xl">🔊</button></div>`).join('')}</div>`;
        }

        function speak(t) { const m = new SpeechSynthesisUtterance(t); m.lang = 'en-US'; window.speechSynthesis.speak(m); }
        function giveMotivation() { alert(motivations[Math.floor(Math.random() * motivations.length)]); }
        function startQuiz() { setupGame('quiz'); }
        function startSpelling() { setupGame('spelling'); }
        function startTranslation() { setupGame('translation'); }
        function backToMenu() { document.getElementById('game-area').classList.add('hidden'); document.getElementById('finish-screen').classList.add('hidden'); document.getElementById('game-menu').classList.remove('hidden'); }
        document.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = document.querySelector('#game-content button.btn-grad'); if(b) b.click(); } });
    </script>
</body>
</html>
